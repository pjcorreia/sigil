<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg-primary: #050510;
    --bg-secondary: #0f1419;
    --bg-card: #1a1f2e;
    --bg-card-hover: #1f2a3a;
    --accent: #00ff88;
    --accent-dim: #00ff8833;
    --accent-glow: #00ff8822;
    --red: #ff4757;
    --red-dim: #ff475722;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --purple: #8b5cf6;
    --orange: #ffa502;
    --text-primary: #e8eaf0;
    --text-secondary: #8892a8;
    --text-muted: #4a5568;
    --border: #1e2a3a;
    --border-accent: #00ff8844;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 255, 136, 0.01) 2px,
      rgba(0, 255, 136, 0.01) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* === NAVIGATION === */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(5, 5, 16, 0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
  }

  .nav-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .nav-brand:hover { opacity: 0.8; }

  .nav-brand .logo {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--accent);
    letter-spacing: 3px;
  }

  .nav-brand .tagline {
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
    flex: 1;
    margin-left: 3rem;
  }

  .nav-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: color 0.2s;
    cursor: pointer;
  }

  .nav-links a:hover { color: var(--accent); }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .lang-toggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .lang-toggle a {
    padding: 4px 10px;
    font-family: "JetBrains Mono", monospace;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-decoration: none;
    color: var(--text-muted);
    transition: all 0.2s;
    cursor: pointer;
  }

  .lang-toggle a.active {
    background: var(--accent);
    color: var(--bg-primary);
  }

  .lang-toggle a:not(.active):hover {
    color: var(--accent);
    background: var(--accent-dim);
  }

  /* === SEARCH & FILTERS === */
  .search-container {
    position: fixed;
    top: 80px;
    left: 20px;
    z-index: 50;
  }

  .search-box {
    background: rgba(26, 31, 46, 0.9);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    width: 220px;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }

  .search-box:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
  }

  .filter-container {
    position: fixed;
    top: 135px;
    left: 20px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .filter-btn {
    background: rgba(26, 31, 46, 0.9);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    backdrop-filter: blur(10px);
  }

  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-btn.active {
    background: var(--accent);
    color: var(--bg-primary);
    border-color: var(--accent);
  }

  /* === LEGEND === */
  .legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(26, 31, 46, 0.95);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    z-index: 50;
    backdrop-filter: blur(10px);
    max-width: 250px;
  }

  .legend-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 0.85rem;
  }

  .legend-item:last-child {
    margin-bottom: 0;
  }

  .legend-swatch {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--text-primary);
    flex-shrink: 0;
  }

  .legend-swatch.diamond {
    border-radius: 0;
    transform: rotate(45deg);
  }

  .legend-label {
    color: var(--text-secondary);
    font-size: 0.8rem;
  }

  /* === HUD INFO === */
  .hud-stats {
    position: fixed;
    top: 80px;
    right: 20px;
    background: rgba(26, 31, 46, 0.95);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.8rem;
    z-index: 50;
    backdrop-filter: blur(10px);
    font-family: 'JetBrains Mono', monospace;
  }

  .hud-stat {
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .hud-stat:last-child {
    margin-bottom: 0;
  }

  .hud-stat-label {
    color: var(--accent);
    font-weight: 600;
  }

  .hud-controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(26, 31, 46, 0.95);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.75rem;
    z-index: 50;
    backdrop-filter: blur(10px);
    text-align: right;
    color: var(--text-secondary);
    max-width: 200px;
    line-height: 1.5;
  }

  /* === TOOLTIP === */
  .tooltip {
    position: fixed;
    background: rgba(26, 31, 46, 0.98);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px 16px;
    pointer-events: none;
    z-index: 60;
    display: none;
    backdrop-filter: blur(10px);
    max-width: 300px;
    box-shadow: 0 8px 32px rgba(0, 255, 136, 0.2);
  }

  .tooltip.visible {
    display: block;
  }

  .tooltip-name {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--accent);
    font-size: 0.9rem;
    margin-bottom: 4px;
  }

  .tooltip-type {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .tooltip-info {
    font-size: 0.8rem;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  /* === INFO PANEL === */
  .info-panel {
    position: fixed;
    top: 60px;
    right: 0;
    width: 0;
    height: calc(100vh - 60px);
    background: rgba(26, 31, 46, 0.98);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    z-index: 40;
    transition: width 0.3s ease;
    backdrop-filter: blur(10px);
  }

  .info-panel.open {
    width: 380px;
  }

  .panel-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(26, 31, 46, 0.95);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .panel-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .panel-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 1.5rem;
    cursor: pointer;
    transition: color 0.2s;
  }

  .panel-close:hover {
    color: var(--accent);
  }

  .panel-content {
    padding: 20px;
  }

  .panel-item {
    margin-bottom: 20px;
  }

  .panel-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
  }

  .panel-value {
    color: var(--text-secondary);
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .panel-value strong {
    color: var(--text-primary);
  }

  .panel-links {
    border-top: 1px solid var(--border);
    margin-top: 20px;
    padding-top: 20px;
  }

  .panel-link {
    display: inline-block;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.8rem;
    font-family: 'JetBrains Mono', monospace;
    transition: all 0.2s;
    margin-right: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }

  .panel-link:hover {
    background: var(--accent);
    color: var(--bg-primary);
    border-color: var(--accent);
  }

  /* === RESPONSIVE === */
  @media (max-width: 768px) {
    .nav-links { display: none; }
    .info-panel.open { width: 100%; }
    .search-box { width: 160px; }
    .legend { bottom: auto; top: 80px; left: 10px; max-width: 200px; }
    .hud-stats { display: none; }
    .hud-controls { bottom: 10px; right: 10px; font-size: 0.65rem; max-width: 160px; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<nav>
  <div class="nav-inner">
    <a href="en.html" class="nav-brand">
      <span class="logo">SIGIL</span>

<div class="hud-stats" id="hudStats">

<script>
// ============================================================
// THREE.JS 3D NETWORK VISUALIZATION
// ============================================================

// Scene setup
const canvas = document.getElementById('canvas');
const width = window.innerWidth;
const height = window.innerHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.FogExp2(0x050510, 0.008);

const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 10000);
camera.position.set(0, 50, 80);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowShadowMap;

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xffffff, 1, 500);
pointLight.position.set(100, 100, 100);
pointLight.castShadow = true;
scene.add(pointLight);

// Star particles for space background
function createStarfield() {
  const starCount = 2000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(starCount * 3);

  for (let i = 0; i < starCount * 3; i += 3) {
    positions[i] = (Math.random() - 0.5) * 2000;
    positions[i + 1] = (Math.random() - 0.5) * 2000;
    positions[i + 2] = (Math.random() - 0.5) * 2000;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({ color: 0xffffff, size: 1, sizeAttenuation: true, opacity: 0.4 });
  const stars = new THREE.Points(geometry, material);
  scene.add(stars);
}
createStarfield();

// Node and link data
const nodesData = [
  // Public entities
  { id: "SUCH", name: "SUCH", type: "public", value: 100, color: 0x3b82f6, label: "Hospital Shared Services" },
  { id: "IP", name: "Infraestruturas de Portugal", type: "public", value: 120, color: 0x3b82f6, label: "Infrastructure" },
  { id: "eSPap", name: "eSPap", type: "public", value: 80, color: 0x3b82f6, label: "E-governance" },
  { id: "FCT", name: "FCT", type: "public", value: 110, color: 0x3b82f6, label: "Science Foundation" },
  { id: "Turismo", name: "Turismo de Portugal", type: "public", value: 85, color: 0x3b82f6, label: "Tourism" },
  { id: "SPMS", name: "SPMS", type: "public", value: 95, color: 0x3b82f6, label: "Health Shared Services" },
  { id: "MOH", name: "Ministry of Health", type: "public", value: 105, color: 0x3b82f6, label: "Government" },
  { id: "HSJ", name: "Hospital de São José", type: "public", value: 75, color: 0x3b82f6, label: "Hospital" },
  { id: "CHLC", name: "CHLC", type: "public", value: 90, color: 0x3b82f6, label: "Hospital" },

  // Private companies
  { id: "Siemens", name: "Siemens", type: "private", value: 130, color: 0xf59e0b, label: "Technology" },
  { id: "Elsevier", name: "Elsevier", type: "private", value: 125, color: 0xf59e0b, label: "Academic Publishing" },
  { id: "Dentsu", name: "Dentsu", type: "private", value: 100, color: 0xf59e0b, label: "Advertising" },
  { id: "Autoeuropa", name: "Autoeuropa (VW)", type: "private", value: 115, color: 0xf59e0b, label: "Automotive" },
  { id: "Fine", name: "Fine Facility", type: "private", value: 60, color: 0xf59e0b, label: "Cleaning" },
  { id: "2SS", name: "2SS Security", type: "private", value: 55, color: 0xf59e0b, label: "Security" },
  { id: "Securitas", name: "Securitas", type: "private", value: 65, color: 0xf59e0b, label: "Security" },
  { id: "Prosegur", name: "Prosegur", type: "private", value: 70, color: 0xf59e0b, label: "Security" },

  // People
  { id: "DirectorA", name: "Director Network A", type: "person", value: 40, color: 0x8b5cf6, label: "Director" },
  { id: "DirectorB", name: "Director Network B", type: "person", value: 40, color: 0x8b5cf6, label: "Director" },

  // Critical findings
  { id: "Finding1", name: "Hidden Debt €45.5M", type: "finding", value: 80, color: 0xff4757, label: "Critical Finding" },
  { id: "Finding2", name: "Academic Monopoly", type: "finding", value: 85, color: 0xff4757, label: "Critical Finding" },
  { id: "Finding3", name: "Incumbency Pipeline", type: "finding", value: 75, color: 0xff4757, label: "Critical Finding" },
  { id: "Finding4", name: "Systematic Direct Awards", type: "finding", value: 90, color: 0xff4757, label: "Critical Finding" },
];

const linksData = [
  { source: "SUCH", target: "Autoeuropa", strength: 100, risk: "critical", label: "€45.5M contract" },
  { source: "SUCH", target: "HSJ", strength: 50, risk: "normal", label: "Shared services" },
  { source: "SUCH", target: "CHLC", strength: 70, risk: "high", label: "€19.3M debt" },
  { source: "SUCH", target: "MOH", strength: 40, risk: "normal", label: "Government oversight" },
  { source: "SUCH", target: "Finding1", strength: 90, risk: "critical", label: "€45.5M hidden" },

  { source: "Siemens", target: "IP", strength: 100, risk: "critical", label: "109 direct awards" },
  { source: "Siemens", target: "eSPap", strength: 60, risk: "high", label: "IT systems" },
  { source: "Siemens", target: "Finding4", strength: 85, risk: "critical", label: "Systematic awards" },

  { source: "Elsevier", target: "FCT", strength: 95, risk: "critical", label: "€120M+ monopoly" },
  { source: "Elsevier", target: "Finding2", strength: 90, risk: "critical", label: "Academic monopoly" },

  { source: "Dentsu", target: "Turismo", strength: 75, risk: "high", label: "€20M+ pipeline" },
  { source: "Dentsu", target: "Finding3", strength: 80, risk: "critical", label: "Incumbency pipeline" },

  { source: "Fine", target: "SPMS", strength: 50, risk: "normal", label: "Cleaning contracts" },
  { source: "2SS", target: "SPMS", strength: 45, risk: "normal", label: "Security contracts" },
  { source: "Securitas", target: "SPMS", strength: 40, risk: "normal", label: "Security" },
  { source: "Securitas", target: "MOH", strength: 35, risk: "normal", label: "Public contracts" },
  { source: "Prosegur", target: "MOH", strength: 35, risk: "normal", label: "Public contracts" },
  { source: "Prosegur", target: "SPMS", strength: 35, risk: "normal", label: "Security" },

  { source: "MOH", target: "HSJ", strength: 30, risk: "normal", label: "Government control" },
  { source: "MOH", target: "CHLC", strength: 30, risk: "normal", label: "Government control" },
  { source: "SPMS", target: "HSJ", strength: 40, risk: "normal", label: "Services" },
  { source: "SPMS", target: "CHLC", strength: 40, risk: "normal", label: "Services" },

  { source: "DirectorA", target: "Fine", strength: 60, risk: "normal", label: "Director" },
  { source: "DirectorA", target: "2SS", strength: 55, risk: "normal", label: "Director" },
  { source: "DirectorB", target: "Securitas", strength: 55, risk: "normal", label: "Director" },
  { source: "DirectorB", target: "Prosegur", strength: 55, risk: "normal", label: "Director" },
];

// 3D Objects
const nodeObjects = {};
const nodeLabels = {};
const nodeLines = {};
const lines = [];
let selectedNode = null;
let filteredType = 'all';

// Create node meshes
nodesData.forEach(nodeData => {
  const geometry = nodeData.type === 'finding'
    ? createOctahedron(nodeData.value * 0.005)
    : new THREE.SphereGeometry(nodeData.value * 0.005, 32, 32);

  const material = new THREE.MeshStandardMaterial({
    color: nodeData.color,
    emissive: new THREE.Color(nodeData.color).multiplyScalar(0.5),
    metalness: 0.7,
    roughness: 0.2,
    wireframe: false,
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.userData = nodeData;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.set(
    (Math.random() - 0.5) * 200,
    (Math.random() - 0.5) * 200,
    (Math.random() - 0.5) * 200
  );

  // Add glow sprite for nodes
  const glowGeometry = new THREE.SphereGeometry(nodeData.value * 0.009, 16, 16);
  const glowMaterial = new THREE.MeshBasicMaterial({
    color: nodeData.color,
    transparent: true,
    opacity: 0.2,
  });
  const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
  mesh.add(glowMesh);
  mesh.glowMesh = glowMesh;

  scene.add(mesh);
  nodeObjects[nodeData.id] = { mesh, velocity: { x: 0, y: 0, z: 0 } };
});

// Create octahedron geometry
function createOctahedron(size) {
  const geometry = new THREE.OctahedronGeometry(size, 0);
  return geometry;
}

// Create links
linksData.forEach(linkData => {
  const sourceNode = nodeObjects[linkData.source];
  const targetNode = nodeObjects[linkData.target];

  if (sourceNode && targetNode) {
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array([0, 0, 0, 0, 0, 0]);
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    let lineColor = 0x00ff8844;
    if (linkData.risk === 'critical') lineColor = 0xff4757;
    else if (linkData.risk === 'high') lineColor = 0xffa502;

    const lineMaterial = new THREE.LineBasicMaterial({
      color: lineColor,
      transparent: true,
      opacity: 0.6,
      linewidth: linkData.risk === 'critical' ? 3 : 1,
    });

    const line = new THREE.Line(geometry, lineMaterial);
    scene.add(line);
    lines.push({
      line,
      source: sourceNode,
      target: targetNode,
      data: linkData,
    });
  }
});

// Physics simulation
function updatePhysics() {
  const nodes = Object.values(nodeObjects);
  const damping = 0.95;
  const springStrength = 0.001;
  const repulsionStrength = 2000;
  const repulsionDistance = 200;

  // Apply spring forces
  linksData.forEach(link => {
    const source = nodeObjects[link.source];
    const target = nodeObjects[link.target];

    if (source && target) {
      const dx = target.mesh.position.x - source.mesh.position.x;
      const dy = target.mesh.position.y - source.mesh.position.y;
      const dz = target.mesh.position.z - source.mesh.position.z;
      const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

      if (distance > 0) {
        const desiredDistance = link.strength;
        const force = springStrength * (distance - desiredDistance);

        const fx = (dx / distance) * force;
        const fy = (dy / distance) * force;
        const fz = (dz / distance) * force;

        source.velocity.x += fx;
        source.velocity.y += fy;
        source.velocity.z += fz;

        target.velocity.x -= fx;
        target.velocity.y -= fy;
        target.velocity.z -= fz;
      }
    }
  });

  // Apply repulsion forces
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const node1 = nodes[i];
      const node2 = nodes[j];

      const dx = node2.mesh.position.x - node1.mesh.position.x;
      const dy = node2.mesh.position.y - node1.mesh.position.y;
      const dz = node2.mesh.position.z - node1.mesh.position.z;
      const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

      if (distance < repulsionDistance && distance > 0) {
        const force = repulsionStrength / (distance * distance);

        const fx = (dx / distance) * force;
        const fy = (dy / distance) * force;
        const fz = (dz / distance) * force;

        node1.velocity.x -= fx;
        node1.velocity.y -= fy;
        node1.velocity.z -= fz;

        node2.velocity.x += fx;
        node2.velocity.y += fy;
        node2.velocity.z += fz;
      }
    }
  }

  // Apply velocity and damping
  nodes.forEach(node => {
    node.velocity.x *= damping;
    node.velocity.y *= damping;
    node.velocity.z *= damping;

    node.mesh.position.x += node.velocity.x;
    node.mesh.position.y += node.velocity.y;
    node.mesh.position.z += node.velocity.z;
  });
}

// Update line positions
function updateLines() {
  lines.forEach(lineObj => {
    const positions = lineObj.line.geometry.attributes.position.array;
    positions[0] = lineObj.source.mesh.position.x;
    positions[1] = lineObj.source.mesh.position.y;
    positions[2] = lineObj.source.mesh.position.z;
    positions[3] = lineObj.target.mesh.position.x;
    positions[4] = lineObj.target.mesh.position.y;
    positions[5] = lineObj.target.mesh.position.z;
    lineObj.line.geometry.attributes.position.needsUpdate = true;
  });
}

// Camera controls
const controls = {
  isRotating: false,
  isPanning: false,
  previousMousePosition: { x: 0, y: 0 },
  rotation: { x: 0, y: 0 },
  panX: 0,
  panY: 0,
  zoom: 1,
};

document.addEventListener('mousedown', (e) => {
  controls.previousMousePosition = { x: e.clientX, y: e.clientY };
  if (e.button === 0) controls.isRotating = true;
  if (e.button === 2) controls.isPanning = true;
});

document.addEventListener('mousemove', (e) => {
  const deltaX = e.clientX - controls.previousMousePosition.x;
  const deltaY = e.clientY - controls.previousMousePosition.y;

  if (controls.isRotating) {
    controls.rotation.y += deltaX * 0.005;
    controls.rotation.x += deltaY * 0.005;
  }

  if (controls.isPanning) {
    controls.panX += deltaX * 0.1;
    controls.panY -= deltaY * 0.1;
  }

  controls.previousMousePosition = { x: e.clientX, y: e.clientY };
});

document.addEventListener('mouseup', () => {
  controls.isRotating = false;
  controls.isPanning = false;
});

document.addEventListener('wheel', (e) => {
  e.preventDefault();
  controls.zoom *= (1 - e.deltaY * 0.001);
  controls.zoom = Math.max(0.1, Math.min(5, controls.zoom));
}, { passive: false });

document.addEventListener('contextmenu', (e) => e.preventDefault());

// Update camera
function updateCamera() {
  const baseDistance = 150 / controls.zoom;
  camera.position.x = Math.sin(controls.rotation.y) * Math.cos(controls.rotation.x) * baseDistance + controls.panX * 0.1;
  camera.position.y = Math.sin(controls.rotation.x) * baseDistance + controls.panY * 0.1;
  camera.position.z = Math.cos(controls.rotation.y) * Math.cos(controls.rotation.x) * baseDistance;
  camera.lookAt(controls.panX * 0.1, controls.panY * 0.1, 0);
}

// Raycasting for interaction
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

document.addEventListener('click', (event) => {
  if (event.target.tagName === 'CANVAS') {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const meshes = Object.values(nodeObjects).map(n => n.mesh);
    const intersects = raycaster.intersectObjects(meshes);

    if (intersects.length > 0) {
      selectedNode = intersects[0].object.userData;
      showPanel(selectedNode);
    }
  }
});

// Hover detection
let hoveredNode = null;
document.addEventListener('mousemove', (event) => {
  if (event.target.tagName === 'CANVAS') {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const meshes = Object.values(nodeObjects).map(n => n.mesh);
    const intersects = raycaster.intersectObjects(meshes);

    if (intersects.length > 0) {
      hoveredNode = intersects[0].object.userData;
      showTooltip(event, hoveredNode);

      // Glow effect on hover
      Object.values(nodeObjects).forEach(node => {
        if (node.mesh.glowMesh) {
          node.mesh.glowMesh.material.opacity = node.mesh.userData.id === hoveredNode.id ? 0.5 : 0.2;
        }
      });
    } else {
      hoveredNode = null;
      hideTooltip();
      Object.values(nodeObjects).forEach(node => {
        if (node.mesh.glowMesh) {
          node.mesh.glowMesh.material.opacity = 0.2;
        }
      });
    }
  }
});

// Search functionality
document.getElementById('search').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();

  Object.values(nodeObjects).forEach(node => {
    const match = node.mesh.userData.name.toLowerCase().includes(query) ||
                  node.mesh.userData.id.toLowerCase().includes(query);
    node.mesh.userData.searchMatch = match;
  });
});

// Filter functionality
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');

    filteredType = e.target.dataset.filter;
  });
});

// Tooltip
const tooltip = document.getElementById('tooltip');

function showTooltip(event, nodeData) {
  tooltip.classList.add('visible');
  tooltip.innerHTML = `
    <div class="tooltip-name">${nodeData.name}</div>
    <div class="tooltip-type">${nodeData.type.toUpperCase()}</div>
    <div class="tooltip-info">${nodeData.label}</div>
  `;

  tooltip.style.left = (event.clientX + 15) + 'px';
  tooltip.style.top = (event.clientY + 15) + 'px';
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

// Info panel
const infoPanel = document.getElementById('infoPanel');
const panelContent = document.getElementById('panelContent');
const panelClose = document.getElementById('panelClose');

function showPanel(nodeData) {
  const connections = linksData.filter(l => l.source === nodeData.id || l.target === nodeData.id);

  let html = `
    <div class="panel-item">
      <span class="panel-label">Name</span>
      <div class="panel-value">${nodeData.name}</div>
    </div>
    <div class="panel-item">
      <span class="panel-label">Type</span>
      <div class="panel-value">${nodeData.type.toUpperCase()}</div>
    </div>
    <div class="panel-item">
      <span class="panel-label">Category</span>
      <div class="panel-value">${nodeData.label}</div>
    </div>
  `;

  if (connections.length > 0) {
    html += `
      <div class="panel-item">
        <span class="panel-label">Connections (${connections.length})</span>
        <div class="panel-value">
          ${connections.map(c => {
            const otherId = c.source === nodeData.id ? c.target : c.source;
            const otherNode = nodesData.find(n => n.id === otherId);
            return `<div style="margin: 6px 0;">
              <strong>${otherNode ? otherNode.name : otherId}</strong><br>
              <span style="font-size: 0.75rem; color: var(--text-muted);">${c.label}</span>
            </div>`;
          }).join("")}
        </div>
      </div>
    `;
  }

  if (nodeData.id === 'SUCH') {
    html += `
      <div class="panel-links">
        <a href="#" class="panel-link">View Deep Dive</a>
        <a href="mailto:denuncia@sigil.pt" class="panel-link">Report</a>
      </div>
    `;
  }

  panelContent.innerHTML = html;
  infoPanel.classList.add('open');
}

panelClose.addEventListener('click', () => {
  infoPanel.classList.remove('open');
  selectedNode = null;
});

// Stats
const statEntities = document.getElementById('statEntities');
const statConnections = document.getElementById('statConnections');
const statFps = document.getElementById('statFps');

statEntities.textContent = nodesData.length;
statConnections.textContent = linksData.length;

let frameCount = 0;
let lastTime = Date.now();

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  // Update physics
  updatePhysics();
  updateLines();
  updateCamera();

  // Apply visibility filter
  Object.values(nodeObjects).forEach(node => {
    const isVisible = filteredType === 'all' || node.mesh.userData.type === filteredType;
    node.mesh.visible = isVisible;
  });

  lines.forEach(lineObj => {
    const sourceVisible = filteredType === 'all' || nodeObjects[lineObj.data.source].mesh.userData.type === filteredType;
    const targetVisible = filteredType === 'all' || nodeObjects[lineObj.data.target].mesh.userData.type === filteredType;
    lineObj.line.visible = sourceVisible && targetVisible;
  });

  // Auto-rotate camera when idle
  if (!controls.isRotating && !controls.isPanning) {
    controls.rotation.y += 0.0001;
  }

  // Render
  renderer.render(scene, camera);

  // Update FPS
  frameCount++;
  const currentTime = Date.now();
  if (currentTime - lastTime >= 1000) {
    statFps.textContent = frameCount;
    frameCount = 0;
    lastTime = currentTime;
  }
}

// Handle window resize
window.addEventListener('resize', () => {
  const newWidth = window.innerWidth;
  const newHeight = window.innerHeight;

  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(newWidth, newHeight);
});

// Start animation
animate();
</script>
