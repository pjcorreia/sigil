<script>
// ===== DATA =====
const COLORS = {
  bg: 0x050510,
  blue: 0x3b82f6,
  amber: 0xf59e0b,
  purple: 0x8b5cf6,
  red: 0xff4757,
  orange: 0xffa502,
  accent: 0x00d4aa,
  white: 0xffffff
};

const NODE_DATA = {
  // Public entities
  SUCH: { type: 'public', color: COLORS.blue, value: 245.5, risk: 'high' },
  IP: { type: 'public', color: COLORS.blue, value: 150, risk: 'high' },

  // Private companies
  Siemens: { type: 'private', color: COLORS.amber, value: 180, risk: 'high' },
  Elsevier: { type: 'private', color: COLORS.amber, value: 120, risk: 'high' },
  Dentsu: { type: 'private', color: COLORS.amber, value: 25, risk: 'high' },
  Autoeuropa: { type: 'private', color: COLORS.amber, value: 45.5, risk: 'high' },
  FFS: { type: 'private', color: COLORS.amber, value: 15, risk: 'medium' },
  '2SS': { type: 'private', color: COLORS.amber, value: 10, risk: 'medium' },
  Securitas: { type: 'private', color: COLORS.amber, value: 12, risk: 'medium' },
  Prosegur: { type: 'private', color: COLORS.amber, value: 8, risk: 'medium' },

  // People/Directors
  RedirA: { type: 'people', color: COLORS.purple, value: 0, risk: 'low', label: 'Rede de Diretores A' },
  RedirB: { type: 'people', color: COLORS.purple, value: 0, risk: 'low', label: 'Rede de Diretores B' },

  // Findings
  DVD: { type: 'finding', color: COLORS.red, value: 45.5, risk: 'high', label: 'Dívida Oculta €45.5M' },
  MA: { type: 'finding', color: COLORS.red, value: 120, risk: 'high', label: 'Monopólio Académico' },
  PI: { type: 'finding', color: COLORS.red, value: 20, risk: 'high', label: 'Pipeline de Incumbência' },
  ADS: { type: 'finding', color: COLORS.red, value: 109, risk: 'high', label: 'Ajustes Diretos Sistemáticos' }
};

const EDGES = [
  { source: 'SUCH', target: 'Autoeuropa', value: 45.5, type: 'critical', label: '€45.5M' },
  { source: 'SUCH', target: 'HSJ', value: 50, type: 'normal' },
  { source: 'SUCH', target: 'CHLC', value: 60, type: 'normal' },
  { source: 'SUCH', target: 'MS', value: 200, type: 'normal' },
  { source: 'SUCH', target: 'DVD', value: 45.5, type: 'critical' },

  { source: 'Siemens', target: 'IP', value: 109, type: 'critical', label: '109 ajustes diretos' },
  { source: 'Siemens', target: 'eSPap', value: 80, type: 'high' },
  { source: 'Siemens', target: 'ADS', value: 109, type: 'critical' },

  { source: 'Elsevier', target: 'FCT', value: 120, type: 'critical', label: '€120M+ monopólio' },
  { source: 'Elsevier', target: 'MA', value: 120, type: 'critical' },

  { source: 'Dentsu', target: 'TP', value: 20, type: 'high', label: '€20M+ pipeline' },
  { source: 'Dentsu', target: 'PI', value: 20, type: 'critical' },

  { source: 'FFS', target: 'SPMS', value: 15, type: 'high' },
  { source: '2SS', target: 'SPMS', value: 10, type: 'high' },
  { source: 'Securitas', target: 'SPMS', value: 12, type: 'normal' },
  { source: 'Prosegur', target: 'SPMS', value: 8, type: 'normal' },

  { source: 'RedirA', target: 'FFS', value: 0, type: 'director' },
  { source: 'RedirA', target: '2SS', value: 0, type: 'director' },
  { source: 'RedirB', target: 'Securitas', value: 0, type: 'director' },
  { source: 'RedirB', target: 'Prosegur', value: 0, type: 'director' }
];

// ===== THREE.JS SETUP =====

const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(COLORS.bg);
scene.fog = new THREE.Fog(COLORS.bg, 200, 500);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
camera.position.set(0, 0, 100);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;

// ===== LIGHTING =====

const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0xffffff, 0.8);
pointLight.position.set(100, 100, 100);
scene.add(pointLight);

// ===== STARFIELD =====

function createStarfield() {
  const starGeometry = new THREE.BufferGeometry();
  const starCount = 2000;
  const positions = new Float32Array(starCount * 3);

  for (let i = 0; i < starCount * 3; i += 3) {
    positions[i] = (Math.random() - 0.5) * 1000;
    positions[i + 1] = (Math.random() - 0.5) * 1000;
    positions[i + 2] = (Math.random() - 0.5) * 1000;
  }

  starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, sizeAttenuation: true });
  const stars = new THREE.Points(starGeometry, starMaterial);
  scene.add(stars);
}

createStarfield();

// ===== PHYSICS NODE CLASS =====

class PhysicsNode {
  constructor(id, x, y, z, data) {
    this.id = id;
    this.position = new THREE.Vector3(x, y, z);
    this.velocity = new THREE.Vector3(0, 0, 0);
    this.acceleration = new THREE.Vector3(0, 0, 0);
    this.data = data;
    this.mass = Math.max(1, Math.log(data.value + 1) / 2);
    this.fixed = false;
  }

  applyForce(force) {
    if (this.fixed) return;
    const f = force.clone().divideScalar(this.mass);
    this.acceleration.add(f);
  }

  update() {
    if (this.fixed) return;

    this.velocity.add(this.acceleration);
    this.velocity.multiplyScalar(0.99);
    this.position.add(this.velocity);
    this.acceleration.multiplyScalar(0);

    const bounds = 150;
    if (Math.abs(this.position.x) > bounds) this.position.x = Math.sign(this.position.x) * bounds;
    if (Math.abs(this.position.y) > bounds) this.position.y = Math.sign(this.position.y) * bounds;
    if (Math.abs(this.position.z) > bounds) this.position.z = Math.sign(this.position.z) * bounds;
  }
}

// ===== NODE CREATION =====

const nodes = [];
const nodeMap = new Map();
const physicsNodes = [];

function createNodeMesh(data) {
  const size = Math.max(1, Math.log(data.value + 1) * 0.8);

  let geometry;
  if (data.type === 'finding') {
    geometry = new THREE.OctahedronGeometry(size * 0.7, 1);
  } else {
    geometry = new THREE.IcosahedronGeometry(size, 4);
  }

  const material = new THREE.MeshPhongMaterial({
    color: data.color,
    emissive: 0x000000,
    emissiveIntensity: 0,
    wireframe: false,
    shininess: 100,
    specular: 0x111111
  });

  return new THREE.Mesh(geometry, material);
}

function createNodeGlow(color) {
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, 'rgba(255,255,255,0.8)');
  gradient.addColorStop(0.5, 'rgba(255,255,255,0.3)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 64, 64);

  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, sizeAttenuation: true });
  const sprite = new THREE.Sprite(material);
  sprite.scale.setScalar(5);

  return sprite;
}

function createNodeLabel(label) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 20px Inter';
  ctx.fillStyle = '#e8eaf0';
  ctx.textAlign = 'center';
  ctx.fillText(label.substring(0, 15), 128, 40);

  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(20, 5, 1);
  sprite.position.y = -8;

  return sprite;
}

for (const [id, data] of Object.entries(NODE_DATA)) {
  const x = (Math.random() - 0.5) * 100;
  const y = (Math.random() - 0.5) * 100;
  const z = (Math.random() - 0.5) * 100;

  const physicsNode = new PhysicsNode(id, x, y, z, data);
  physicsNodes.push(physicsNode);

  // Plain object to store node data
  const node = {
    id: id,
    physicsNode: physicsNode,
    data: data,
    label: data.label || id,
    visible: true,
    isHovered: false,
    isSelected: false,
    pulseTime: 0,
    mesh: null,
    glow: null,
    labelSprite: null,
    group: new THREE.Group()
  };

  // Create mesh (NOT extending THREE.Mesh)
  node.mesh = createNodeMesh(data);
  node.group.add(node.mesh);

  // Create glow
  node.glow = createNodeGlow(data.color);
  node.group.add(node.glow);

  // Create label
  node.labelSprite = createNodeLabel(node.label);
  node.group.add(node.labelSprite);

  // Position from physics
  node.group.position.copy(physicsNode.position);

  scene.add(node.group);
  nodes.push(node);
  nodeMap.set(id, node);
}

// ===== EDGES =====

const edges = [];
const edgeLines = new THREE.Group();
scene.add(edgeLines);

for (const edgeData of EDGES) {
  const sourceNode = nodeMap.get(edgeData.source);
  const targetNode = nodeMap.get(edgeData.target);

  if (!sourceNode || !targetNode) continue;

  let color = COLORS.accent;
  let thickness = 0.5;

  if (edgeData.type === 'critical') {
    color = COLORS.red;
    thickness = 1.5;
  } else if (edgeData.type === 'high') {
    color = COLORS.orange;
    thickness = 1.2;
  } else if (edgeData.type === 'director') {
    color = COLORS.purple;
    thickness = 0.3;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(
    new Float32Array([0, 0, 0, 0, 0, 0]), 3
  ));

  const lineMaterial = new THREE.LineBasicMaterial({
    color: color,
    linewidth: thickness,
    fog: true
  });

  const line = new THREE.Line(geometry, lineMaterial);
  edgeLines.add(line);

  const edge = {
    source: sourceNode,
    target: targetNode,
    line: line,
    ...edgeData
  };

  edges.push(edge);
}

// ===== PHYSICS SIMULATION =====

function simulatePhysics(iterations) {
  const springForce = 0.5;
  const repulsionForce = 50;
  const restDistance = 30;

  for (let iter = 0; iter < iterations; iter++) {
    // Reset forces
    for (const pnode of physicsNodes) {
      pnode.acceleration.multiplyScalar(0);
    }

    // Spring forces along edges
    for (const edge of edges) {
      const source = edge.source.physicsNode;
      const target = edge.target.physicsNode;

      const delta = target.position.clone().sub(source.position);
      const distance = Math.max(delta.length(), 1);
      const displacement = distance - restDistance;

      const force = delta.normalize().multiplyScalar(displacement * springForce);

      source.applyForce(force);
      target.applyForce(force.clone().multiplyScalar(-1));
    }

    // Repulsion between all nodes
    for (let i = 0; i < physicsNodes.length; i++) {
      for (let j = i + 1; j < physicsNodes.length; j++) {
        const a = physicsNodes[i];
        const b = physicsNodes[j];

        const delta = a.position.clone().sub(b.position);
        const distance = Math.max(delta.length(), 1);
        const force = delta.normalize().multiplyScalar(repulsionForce / (distance * distance));

        a.applyForce(force);
        b.applyForce(force.clone().multiplyScalar(-1));
      }
    }

    // Update physics
    for (const pnode of physicsNodes) {
      pnode.update();
    }
  }
}

// Pre-settle layout
simulatePhysics(200);

// ===== RAYCASTER & INTERACTIONS =====

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let selectedNode = null;
let hoveredNode = null;

function updateNodeVisuals() {
  for (const node of nodes) {
    if (!node.visible) {
      node.group.visible = false;
      continue;
    }

    node.group.visible = true;

    const isConnectedToSelected = selectedNode && (
      edges.some(e => (e.source === node && e.target === selectedNode) || (e.target === node && e.source === selectedNode)) ||
      node === selectedNode
    );

    if (node.isSelected) {
      node.mesh.material.emissiveIntensity = 0.8;
      node.mesh.material.emissive.setHex(node.data.color);
      node.mesh.scale.multiplyScalar(1.2);
    } else if (node.isHovered) {
      node.mesh.material.emissiveIntensity = 0.6;
      node.mesh.material.emissive.setHex(node.data.color);
    } else if (selectedNode && !isConnectedToSelected) {
      node.mesh.material.opacity = 0.2;
      node.mesh.material.transparent = true;
    } else {
      node.mesh.material.emissiveIntensity = 0.3;
      node.mesh.material.emissive.setHex(node.data.color);
      node.mesh.material.opacity = 1;
      node.mesh.material.transparent = false;
    }

    node.mesh.scale.set(1, 1, 1);
    if (node.isSelected) {
      node.mesh.scale.multiplyScalar(1.2);
    }
  }

  // Update edge visibility
  for (const edge of edges) {
    if (!edge.source.visible || !edge.target.visible) {
      edge.line.visible = false;
      continue;
    }

    edge.line.visible = true;

    if (selectedNode) {
      const connected = (edge.source === selectedNode || edge.target === selectedNode);
      edge.line.material.opacity = connected ? 1 : 0.1;
      edge.line.material.transparent = true;
    } else {
      edge.line.material.opacity = 1;
      edge.line.material.transparent = false;
    }
  }
}

function onNodeHover(node) {
  if (hoveredNode === node) return;

  if (hoveredNode) {
    hoveredNode.isHovered = false;
  }

  hoveredNode = node;
  if (hoveredNode) {
    hoveredNode.isHovered = true;
  }

  updateNodeVisuals();
}

function onNodeClick(node) {
  if (selectedNode === node) return;

  if (selectedNode) {
    selectedNode.isSelected = false;
  }

  selectedNode = node;
  selectedNode.isSelected = true;

  updateNodeVisuals();
  showInfoPanel(node);
}

function showInfoPanel(node) {
  const panel = document.getElementById('info-panel');
  const data = node.data;

  document.getElementById('info-name').textContent = node.label;

  if (data.value > 0 && data.type !== 'people') {
    document.getElementById('info-value-container').style.display = 'block';
    document.getElementById('info-value').textContent = '€' + data.value + 'M';
  } else {
    document.getElementById('info-value-container').style.display = 'none';
  }

  const typeLabels = {
    public: 'Entidade Pública',
    private: 'Empresa Privada',
    people: 'Pessoa / Diretor',
    finding: 'Descoberta Crítica'
  };

  document.getElementById('info-type').textContent = typeLabels[data.type] || data.type;

  if (data.risk && data.type !== 'people') {
    document.getElementById('info-risk-container').style.display = 'block';
    const riskText = { high: 'ALTO', medium: 'MÉDIO', low: 'BAIXO' }[data.risk] || 'DESCONHECIDO';
    const riskEl = document.getElementById('info-risk');
    riskEl.textContent = riskText;
    riskEl.className = 'risk-level ' + data.risk;
  } else {
    document.getElementById('info-risk-container').style.display = 'none';
  }

  // Connections
  const connectionsList = document.getElementById('info-connections');
  connectionsList.innerHTML = '';

  const connections = edges.filter(e => e.source === node || e.target === node);

  if (connections.length > 0) {
    document.getElementById('info-connections-container').style.display = 'block';

    for (const edge of connections) {
      const targetId = edge.source === node ? edge.target.id : edge.source.id;
      const targetNode = nodeMap.get(targetId);

      const item = document.createElement('div');
      item.className = 'connection-item ' + (edge.type === 'critical' ? 'red' : edge.type === 'high' ? 'orange' : '');

      item.innerHTML = `
        <span class="connection-target">${targetNode.label}</span>
        ${edge.value > 0 ? `<span class="connection-value">€${edge.value}M</span>` : ''}
        ${edge.label ? `<span class="connection-value">${edge.label}</span>` : ''}
      `;

      connectionsList.appendChild(item);
    }
  } else {
    document.getElementById('info-connections-container').style.display = 'none';
  }

  panel.classList.add('open');
}

document.getElementById('close-panel').addEventListener('click', () => {
  document.getElementById('info-panel').classList.remove('open');
  if (selectedNode) {
    selectedNode.isSelected = false;
    selectedNode = null;
    updateNodeVisuals();
  }
});

// Search
document.getElementById('search-input').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();

  if (!query) return;

  for (const node of nodes) {
    const label = node.label.toLowerCase();
    if (label.includes(query)) {
      onNodeClick(node);
      break;
    }
  }
});

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const filter = btn.dataset.filter;

    for (const node of nodes) {
      if (filter === 'all') {
        node.visible = true;
      } else if (filter === 'public') {
        node.visible = node.data.type === 'public';
      } else if (filter === 'private') {
        node.visible = node.data.type === 'private';
      } else if (filter === 'people') {
        node.visible = node.data.type === 'people';
      } else if (filter === 'finding') {
        node.visible = node.data.type === 'finding';
      }
    }

    updateNodeVisuals();
  });
});

// Mouse interaction
window.addEventListener('mousemove', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  // Find intersections with node meshes
  const intersects = [];
  for (const node of nodes) {
    if (!node.visible) continue;
    const result = raycaster.ray.intersectSphere(node.group.position, 5);
    if (result) {
      intersects.push({ node, distance: node.group.position.distanceTo(camera.position) });
    }
  }

  intersects.sort((a, b) => a.distance - b.distance);

  if (intersects.length > 0) {
    onNodeHover(intersects[0].node);

    const tooltip = document.getElementById('tooltip');
    tooltip.textContent = intersects[0].node.label + ' (€' + intersects[0].node.data.value + 'M)';
    tooltip.classList.add('visible');
    tooltip.style.left = event.clientX + 10 + 'px';
    tooltip.style.top = event.clientY + 10 + 'px';
  } else {
    onNodeHover(null);
    document.getElementById('tooltip').classList.remove('visible');
  }
});

window.addEventListener('click', (event) => {
  if (event.target.closest('.info-panel') || event.target.closest('.filter-container') ||
      event.target.closest('.search-container') || event.target.closest('nav') ||
      event.target.closest('.legend-container') || event.target.closest('.stats-container') ||
      event.target.closest('.instructions')) {
    return;
  }

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const intersects = [];
  for (const node of nodes) {
    if (!node.visible) continue;
    const result = raycaster.ray.intersectSphere(node.group.position, 5);
    if (result) {
      intersects.push({ node, distance: node.group.position.distanceTo(camera.position) });
    }
  }

  intersects.sort((a, b) => a.distance - b.distance);

  if (intersects.length > 0) {
    onNodeClick(intersects[0].node);
  }
});

// Camera controls
let cameraControls = {
  isRotating: false,
  phi: 0,
  theta: 0,
  distance: 100,
  lastX: 0,
  lastY: 0,
  idleTimer: 0
};

function updateCameraPosition() {
  const x = cameraControls.distance * Math.sin(cameraControls.phi) * Math.cos(cameraControls.theta);
  const y = cameraControls.distance * Math.cos(cameraControls.phi);
  const z = cameraControls.distance * Math.sin(cameraControls.phi) * Math.sin(cameraControls.theta);

  camera.position.set(x, y, z);
  camera.lookAt(0, 0, 0);
}

canvas.addEventListener('mousedown', (e) => {
  cameraControls.isRotating = true;
  cameraControls.lastX = e.clientX;
  cameraControls.lastY = e.clientY;
  cameraControls.idleTimer = 0;
});

canvas.addEventListener('mousemove', (e) => {
  if (!cameraControls.isRotating) return;

  const deltaX = e.clientX - cameraControls.lastX;
  const deltaY = e.clientY - cameraControls.lastY;

  cameraControls.theta += deltaX * 0.005;
  cameraControls.phi += deltaY * 0.005;

  cameraControls.phi = Math.max(0.1, Math.min(Math.PI - 0.1, cameraControls.phi));

  cameraControls.lastX = e.clientX;
  cameraControls.lastY = e.clientY;
  cameraControls.idleTimer = 0;

  updateCameraPosition();
});

canvas.addEventListener('mouseup', () => {
  cameraControls.isRotating = false;
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  cameraControls.distance += e.deltaY * 0.1;
  cameraControls.distance = Math.max(30, Math.min(200, cameraControls.distance));
  cameraControls.idleTimer = 0;
  updateCameraPosition();
}, { passive: false });

// Stats update
function updateStats() {
  const visibleNodes = nodes.filter(n => n.visible);
  const visibleEdges = edges.filter(e => e.source.visible && e.target.visible);
  const totalValue = visibleNodes.reduce((sum, n) => sum + n.data.value, 0);

  document.getElementById('stat-nodes').textContent = visibleNodes.length;
  document.getElementById('stat-edges').textContent = visibleEdges.length;
  document.getElementById('stat-value').textContent = '€' + totalValue.toFixed(1) + 'M';
}

updateStats();
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', updateStats);
});

// ===== ANIMATION LOOP =====

let time = 0;

function animate() {
  requestAnimationFrame(animate);

  time += 0.016;

  // Continue physics simulation
  simulatePhysics(5);

  // Update node positions from physics
  for (const node of nodes) {
    node.group.position.copy(node.physicsNode.position);
  }

  // Update edge geometry
  for (const edge of edges) {
    const pos = edge.line.geometry.attributes.position;
    pos.array[0] = edge.source.group.position.x;
    pos.array[1] = edge.source.group.position.y;
    pos.array[2] = edge.source.group.position.z;
    pos.array[3] = edge.target.group.position.x;
    pos.array[4] = edge.target.group.position.y;
    pos.array[5] = edge.target.group.position.z;
    pos.needsUpdate = true;
  }

  // Rotate findings
  for (const node of nodes) {
    if (node.data.type === 'finding') {
      node.mesh.rotation.x += 0.01;
      node.mesh.rotation.y += 0.01;
    }
  }

  // Idle rotation
  cameraControls.idleTimer += 0.016;
  if (cameraControls.idleTimer > 3 && !cameraControls.isRotating) {
    cameraControls.theta += 0.0005;
    updateCameraPosition();
  }

  renderer.render(scene, camera);
}

animate();

// Handle window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
